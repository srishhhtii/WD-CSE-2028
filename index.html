style.css
@import url("https://fonts.googleapis.com/css2?
family=Dancing+Script:wght@700&family=Roboto:wght@300;500&display=swap");
body {
 background-image: url("https://images.unsplash.com/photo-1470071459604-
3b5ec3a7fe05?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80");
 background-size: cover;
 background-repeat: no-repeat;
 background-attachment: fixed;
 margin: 0;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
}
h1 {
 font-family: "Dancing Script", cursive;
 font-size: 3.5rem;
 color: #ffffff;
 text-shadow: 2px 2px 4px #000000;
 margin-bottom: 10px;
 text-align: center;
}
p {
 font-family: "Roboto", sans-serif;
 font-size: 1.1rem;
 color: #333;
 line-height: 1.6;
}
.glass-card {
 background-color: rgba(255, 255, 255, 0.85);
 width: 500px;
 padding: 40px;
 border-radius: 15px;
 box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
 border: 1px solid rgba(255, 255, 255, 0.3);
}
.btn-style {
 background-color: #ff6b6b;
 color: white;
 font-family: "Roboto", sans-serif;
 font-weight: 500;
 padding: 10px 20px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 display: block;
 margin: 20px auto 0 auto;
 transition: background 0.3s;
}
.btn-style:hover {
 background-color: #ff4757;
}
