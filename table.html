<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Web Page</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #eef2f3;
    text-align: center;
  }
  table {
    width: 60%;
    margin: 50px auto;
    border-collapse: collapse;
    background-color: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  th, td {
    border: 1px solid #ccc;
    padding: 15px;
    font-size: 18px;
  }
  th {
    background-color: #007BFF;
    color: white;
  }
  td {
    color: #333;
  }
  button {
    margin-top: 30px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background-color: #218838;
  }
</style>
</head>
<body>

<h2>My Web Page</h2>

<table>
  <tr>
    <th>Home</th>
    <th>About</th>
    <th>Article</th>
  </tr>
  <tr>
    <td>Welcome to our website!</td>
    <td>We share knowledge and tech updates.</td>
    <td>Read our latest articles on web development and AI.</td>
  </tr>
</table>

<button>Read Now</button>

</body>
</html>
