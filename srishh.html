<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Page</title>
<style>
  body {font-family: Arial; background:#f2f2f2;}
  .box {width:320px; margin:60px auto; background:#fff; padding:20px; border-radius:8px;}
  input, select {width:100%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:5px;}
  input[type=submit]{background:#4CAF50; color:white; border:none; cursor:pointer;}
  input[type=submit]:hover{background:#45a049;}
</style>
</head>
<body>
<div class="box">
  <h2>Register</h2>
  <form>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <select required>
      <option value="">Select Country</option>
      <option>India</option><option>USA</option><option>UK</option>
    </select>
    <input type="submit" value="Register">
  </form>
</div>
</body>
</html>
